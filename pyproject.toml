[project]
name = "mermaiddiagramsaiagent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mkan1ewski", email = "maciek1717.mk@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "huggingface-hub>=2.4.0",
    "openai>=3.49.0",
    "python-dotenv>=1.2.4",
    "scipy>=1.18.1",
]

[project.scripts]
mermaiddiagramsaiagent = "mermaiddiagramsaiagent:main"
download-raw = "mermaiddiagramsaiagent.data.download:main"
report-raw = "mermaiddiagramsaiagent.data.report:main"
build-pilot = "mermaiddiagramsaiagent.data.pilot:main"
describe = "mermaiddiagramsaiagent.data.describe:main"
build-golden = "mermaiddiagramsaiagent.data.golden:main"
evaluate = "mermaiddiagramsaiagent.eval.run:main"

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
